name: Build signal board

# The Apify schedule runs the scraper; this runs an hour later and publishes.
# Adjust the cron to sit after your actor's schedule.
on:
  schedule:
    - cron: "0 7 * * 1-5"     # 07:00 UTC, weekdays
  workflow_dispatch:           # also runnable by hand from the Actions tab

permissions:
  contents: write              # to commit the accumulating history back
  pages: write
  id-token: write

concurrency:
  group: signal-board
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull from Apify and rebuild
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          python build_dashboard.py \
            --task "${{ vars.APIFY_TASK_ID }}" \
            --history data/history.json \
            --max-age-days 365 \
            --client "${{ vars.CLIENT_NAME }}" \
            --title "LinkedIn signal board" \
            --out out

      - name: Commit the updated history
        run: |
          git config user.name  "signal-board"
          git config user.email "actions@users.noreply.github.com"
          git add data/history.json
          git diff --staged --quiet || git commit -m "History as at $(date -u +%Y-%m-%d)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - id: deploy
        uses: actions/deploy-pages@v4
